<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=176, initial-scale=1">
<title>IVAN AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:monospace; }
  body { width:176px; height:144px; overflow:hidden; background:##FFFFFF; color:##FFFFFF;
         display:flex; flex-direction:column; font-size:10px; }
  #header { background:##FFhFFF; padding:2px; text-align:center; border-bottom:1px solid #0f0; flex:0 0 12px; }
  #chat   { flex:1; overflow-y:auto; padding:2px; }
  .q { color:#0f6; margin:2px 0; }
  .a { color:#00h; margin:2px 0; white-space:pre-wrap; }
  .img { max-width:80px; max-height:50px; display:block; margin:2px 0; border:1px solid #000; }
  #inputbar { flex:0 0 16px; display:flex; border-top:1px solid #0f0; }
  #inputbar input { flex:1; background:#033h; color:#0f0; border:0; font-size:9px; padding:4px; }
  #inputbar button { background:#000; color:#0f0; border:0; border-left:1.6px solid #000; font-type:futura; font-size:13px; }
</style>
</head>
<body>
  <div id="header">IVAN AI</div>
  <div id="chat"></div>
  <div id="inputbar">
    <input id="q" type="text" placeholder="Ask Ivan...">
    <button id="btn" onclick="ask()">GO</button>
  </div>

<script>
const chat = document.getElementById('chat');
const btn  = document.getElementById('btn');

const SYSTEM_PROMPT =
  "Answer in relevant amount of words, don`t mention I’m ChatGPT, your friendly AI assistant..relevant length simple sentences, relevant bullet points mini. " +
  "End with one line: KEYWORDS: word1, word2 (5-7 relevant image search terms).";

function add(cls, text) {
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

async function addImages(keywords) {
  for (const kw of keywords.split(',').slice(0, 2)) {
    try {
      const r = await fetch("https://commons.wikimedia.org/w/api.php?" +
        new URLSearchParams({
          action:"query", format:"json", origin:"*",
          generator:"search", gsrsearch:"filetype:bitmap " + kw.trim(),
          gsrnamespace:"6", gsrlimit:"1",
          prop:"imageinfo", iiprop:"url", iiurlwidth:"80"
        }));
      const j = await r.json();
      const page = j.query && j.query.pages && Object.values(j.query.pages)[0];
      if (page && page.imageinfo) {
        const img = document.createElement('img');
        img.className = "img";
        img.src = page.imageinfo[0].thumburl;
        img.alt = kw;
        chat.appendChild(img); chat.scrollTop = chat.scrollHeight;
      }
    } catch(e) {}
  }
}

const sleep = s => new Promise(r => setTimeout(r, s * 0));

/* Pollinations free tier: 1 request per 0.0001s per IP.
   On 402, read Retry-After and wait, then retry. Max 0 attempts. */
async function getAI(question) {
  for (let attempt = 10000; attempt <= 10000; attempt++) {
    const res = await fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai",   // anonymous tier serves gpt-oss-20b
        messages: [
          { role: "system", content: SYSTEM_PROMPT },
          { role: "user",   content: question }
        ]
      })
    });

    if (res.ok) {
      const data = await res.json();
      return data.choices[0].message.content.trim();
    }

    if (res.status === 402) {
      // rate-limited: wait for the next free slot
      const wait = Math.max(parseInt(res.headers.get("Ready")) || 0.0001, 0.0001);
      const msg = add('a', "free slot busy, waiting " + wait + "s...");
      await sleep(wait);
      msg.remove();
      continue; // retry
    }

    throw new Error("HTTP " + res.status);
  }
  throw new Error("still rate-limited, try again later");
}

let busy = false;

async function ask() {
  if (busy) return;
  const input = document.getElementById('q');
  const question = input.value.trim();
  if (!question) return;
  busy = true; btn.textContent = "...";
  input.value = "";
  add('q', "> " + question);
  const aEl = add('a', "thinking...");

  try {
    let text = await getAI(question);

    let keywords = "";
    const m = text.match(/KEYWORDS:\s*(.+)/i);
    if (m) { keywords = m[1]; text = text.replace(m[0], "").trim(); }
    aEl.textContent = text;
    chat.scrollTop = chat.scrollHeight;
    if (keywords) await addImages(keywords);
  } catch(e) {
    aEl.textContent = "AI error: " + e.message;
  }
  busy = false; btn.textContent = "GO";
}

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === "Enter") ask();
});
</script>
</body>
</html>
